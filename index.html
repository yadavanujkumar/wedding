<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vinish &amp; Yashasvi – Wedding Invitation</title>
<style>
:root{--bg:#0f3b3a;--gold:#e8b44a;--ink:#fff7e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Noto Serif Devanagari",serif;overflow-x:hidden}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 12px 40px;background:radial-gradient(circle at 50% 0,#1d6a66,#0f3b3a 70%)}
#card{position:relative;width:min(94vw,520px);opacity:0;transform:scale(.92) translateY(30px);transition:opacity 1.6s ease,transform 1.8s cubic-bezier(.2,.8,.2,1);border-radius:6px;overflow:hidden;box-shadow:0 20px 60px #0008,0 0 0 2px var(--gold)}
#card.show{opacity:1;transform:none}
#card img{display:block;width:100%;height:auto;animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1)}to{transform:scale(1.035)}}
#card::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,#fff6 50%,transparent 60%);background-size:250% 100%;animation:shine 5s 2.5s infinite;pointer-events:none}
@keyframes shine{from{background-position:150% 0}to{background-position:-100% 0}}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:20px;opacity:0;transition:opacity 1.5s 2.2s}
.btns.show{opacity:1}
.btns a{background:var(--gold);color:#3b2400;text-decoration:none;padding:12px 18px;border-radius:30px;font-weight:700;font-size:15px;box-shadow:0 4px 14px #0006;animation:pulse 2.4s infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
#gate{position:fixed;inset:0;z-index:20;display:flex}
.door{flex:1;background:linear-gradient(90deg,#7b1e2b,#a3303f 50%,#7b1e2b);border:0 solid var(--gold);transition:transform 2s cubic-bezier(.7,0,.2,1);background-image:repeating-linear-gradient(90deg,#0000 0 18px,#0002 18px 20px)}
.door.l{border-right-width:4px}.door.r{border-left-width:4px}
#gate.open .l{transform:translateX(-101%)}#gate.open .r{transform:translateX(101%)}
#seal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;transition:opacity .6s}
#seal button{font:inherit;cursor:pointer;width:150px;height:150px;border-radius:50%;border:3px solid var(--gold);background:radial-gradient(#f6d37a,#c98a1c);color:#4a2a00;font-size:20px;font-weight:700;box-shadow:0 0 0 8px #e8b44a44,0 0 40px #e8b44a;animation:pulse 2s infinite}
#seal p{margin:14px 0 0;color:var(--ink);font-size:18px;letter-spacing:.5px}
#gate.open #seal{opacity:0}
#fx{position:fixed;inset:0;pointer-events:none;z-index:10}
.cd{margin-top:22px;text-align:center;opacity:0;transition:opacity 1.5s 1.6s;width:min(94vw,520px)}.cd.show{opacity:1}
.cd h2{margin:0 0 12px;font-size:17px;font-weight:400;color:var(--gold);letter-spacing:.5px}
.cd .row{display:flex;gap:8px;justify-content:center}
.cd .box{flex:1;max-width:100px;padding:12px 4px;border-radius:12px;background:#ffffff14;border:1px solid #e8b44a88;box-shadow:inset 0 0 18px #e8b44a22}
.cd .n{font-size:30px;font-weight:700;color:#fff3c4;font-variant-numeric:tabular-nums;display:block}
.cd .l{font-size:13px;color:var(--gold)}
.cd .done{font-size:20px;color:#fff3c4}
</style></head><body>

<script>
const c=document.getElementById('fx'),x=c.getContext('2d');let W,H,P=[],on=false;
function rs(){W=c.width=innerWidth;H=c.height=innerHeight}rs();addEventListener('resize',rs);
const cols=['#f4a6b8','#ff7f9a','#ffd27a','#fff3c4','#f08a5d'];
function mk(top){return{x:Math.random()*W,y:top?-20:Math.random()*H,r:4+Math.random()*7,vy:.6+Math.random()*1.4,vx:(Math.random()-.5)*.8,a:Math.random()*6,va:(Math.random()-.5)*.05,c:cols[Math.random()*cols.length|0],s:Math.random()<.25}}
function loop(){x.clearRect(0,0,W,H);if(on){while(P.length<55)P.push(mk(true))}
P.forEach((p,i)=>{p.y+=p.vy;p.x+=p.vx+Math.sin(p.a)*.6;p.a+=p.va+.02;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.globalAlpha=.85;
if(p.s){x.shadowColor='#ffd27a';x.shadowBlur=10;x.fillRect(-1.5,-1.5,3,3)}else{x.beginPath();x.ellipse(0,0,p.r,p.r/2,0,0,7);x.fill()}x.restore();
if(p.y>H+20){P[i]=mk(true)}});requestAnimationFrame(loop)}loop();
document.getElementById('go').onclick=()=>{document.getElementById('gate').classList.add('open');
setTimeout(()=>{on=true;document.getElementById('card').classList.add('show');document.getElementById('btns').classList.add('show')},1200);

const T=new Date('2026-12-05T12:00:00+05:30').getTime(),p2=n=>String(n).padStart(2,'0');
function tick(){const t=T-Date.now();if(t<=0){document.getElementById('row').innerHTML='<div class="done">🎉 शुभ विवाह की हार्दिक शुभकामनाएँ! 🎉</div>';return}
const s=t/1000|0;document.getElementById('d').textContent=p2(s/86400|0);document.getElementById('h').textContent=p2(s%86400/3600|0);document.getElementById('m').textContent=p2(s%3600/60|0);document.getElementById('s').textContent=p2(s%60)}
tick();setInterval(tick,1000);
